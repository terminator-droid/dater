services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datingapp
      POSTGRES_USER: datingapp
      POSTGRES_PASSWORD: datingapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT_IN://0.0.0.0:9092,PLAINTEXT_OUT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_IN://kafka:9092,PLAINTEXT_OUT://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT_IN:PLAINTEXT,PLAINTEXT_OUT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT_IN'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  app:
    container_name: dating-service
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - kafka
      - mongodb
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/datingapp
      SPRING.MONGODB.URI: mongodb://mongodb:27017/datingapp
      SPRING.DATA.REDIS.HOST: redis
      SPRING.KAFKA.BOOTSTRAP-SERVERS: kafka:9092


volumes:
  postgres_data:
  mongo_data:
  kafka-data: